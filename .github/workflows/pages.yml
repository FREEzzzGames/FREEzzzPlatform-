name: FREEzzz Platform Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["LIVE playback status"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify integration contract
        run: npm run verify:integration

      - name: Build web portal
        run: npm run build

      - name: Validate Pages entrypoint
        run: |
          test -f dist/index.html
          test ! -f dist/README.md
          grep -q '<script type="module"' dist/index.html
          grep -q 'telegram.org/js/telegram-web-app.js' dist/index.html
          test -s dist/live-status.json
          node -e "const d=require('./dist/live-status.json'); if(!d.sources || Object.keys(d.sources).length===0) throw new Error('LIVE cache has zero sources')"
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Pages smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check deployed portal
        env:
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${DEPLOYED_URL:-https://freezzgames.github.io/FREEzzzPlatform-/}"
          for attempt in $(seq 1 18); do
            code="$(curl -L -s -o /tmp/pages.html -w '%{http_code}' "$url" || true)"
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ] && grep -q 'FREEzzz Platform' /tmp/pages.html && grep -q 'telegram.org/js/telegram-web-app.js' /tmp/pages.html; then
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not serve the connected portal at $url"
          cat /tmp/pages.html || true
          exit 1
