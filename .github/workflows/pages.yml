name: FREEzzz Platform Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web portal
        run: npm run build

      - name: Validate Pages entrypoint
        run: |
          test -f dist/index.html
          test ! -f dist/README.md
          grep -q '<script type="module"' dist/index.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Pages smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check deployed portal
        run: |
          set -euo pipefail
          url="https://freezzgames.github.io/FREEzzzPlatform-/"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -s -o /tmp/pages.html -w '%{http_code}' "$url" || true)"
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ] && grep -q 'FREEzzz Platform' /tmp/pages.html; then
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not serve the portal at $url"
          cat /tmp/pages.html || true
          exit 1
