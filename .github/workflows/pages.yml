name: FREEzzz Platform Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: freezzz-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh LIVE cache
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: npm run refresh:live

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify integration contract
        run: npm run verify:integration

      - name: Build web portal
        run: npm run build

      - name: Validate Pages artifact
        run: |
          set -euo pipefail
          test -f dist/index.html
          test ! -f dist/README.md
          grep -q '<script type="module"' dist/index.html
          grep -q 'telegram.org/js/telegram-web-app.js' dist/index.html
          test -s dist/live-status.json
          node -e "const d=require('./dist/live-status.json'); if(!d.generatedAt || !d.sources || Object.keys(d.sources).length===0) throw new Error('LIVE artifact is empty')"
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

