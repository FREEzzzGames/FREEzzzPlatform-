name: FREEzzz Integration Smoke

on:
  workflow_run:
    workflows: ["FREEzzz Platform Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Web
        run: |
          set -euo pipefail
          url="https://freezzgames.github.io/FREEzzzPlatform-/"
          for attempt in $(seq 1 18); do
            code="$(curl -L --max-time 15 -s -o /tmp/pages.html -w '%{http_code}' "$url" || true)"
            echo "Web attempt $attempt: HTTP $code"
            if [ "$code" = "200" ] && grep -q 'FREEzzz Platform' /tmp/pages.html && grep -q 'telegram.org/js/telegram-web-app.js' /tmp/pages.html; then
              break
            fi
            sleep 10
          done
          test -s /tmp/pages.html
          grep -q 'FREEzzz Platform' /tmp/pages.html
          grep -q 'telegram.org/js/telegram-web-app.js' /tmp/pages.html

      - name: Check LIVE cache chain
        run: |
          set -euo pipefail
          url="https://freezzgames.github.io/FREEzzzPlatform-/live-status.json?smoke=$GITHUB_RUN_ID"
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 15 "$url" -o /tmp/live-status.json; then
              if node - <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("/tmp/live-status.json", "utf8"));
          if (!data?.generatedAt || !data.sources || Object.keys(data.sources).length === 0) process.exit(1);
          console.log("LIVE sources:", Object.keys(data.sources).length);
          NODE
              then
                exit 0
              fi
            fi
            echo "LIVE attempt $attempt: cache not ready"
            sleep 10
          done
          echo "LIVE cache did not become valid"
          exit 1

      - name: Check CHAT bridge chain
        run: |
          set -euo pipefail
          url="https://freezzzplatform-chat.onrender.com/api/chat/config?smoke=$GITHUB_RUN_ID"
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 20 "$url" -o /tmp/chat-config.json; then
              if node - <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("/tmp/chat-config.json", "utf8"));
          if (typeof data?.telegramConfigured !== "boolean" || typeof data?.telegramConnected !== "boolean") process.exit(1);
          console.log("CHAT bridge responded. Telegram configured:", data.telegramConfigured, "connected:", data.telegramConnected);
          NODE
              then
                exit 0
              fi
            fi
            echo "CHAT attempt $attempt: bridge not ready"
            sleep 10
          done
          echo "CHAT bridge did not become ready"
          exit 1

      - name: Report connected release
        run: echo "CONNECTED RELEASE CHECK: PASS"
