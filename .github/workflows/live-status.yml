name: LIVE playback status

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/live-status.yml
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh LIVE status cache
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const youtubeChannels = {
            "papaplatte:youtube": { id: "UCDmbhGe7-wC1a55l5ZYAZJw" },
            "montanablack88:youtube": { id: "UCpAMOlA_0hFXopIxMq8ar0w" },
            "trymacs:youtube": { id: "UC6Gc4KQ1ueDnh8x7plaAD3w" },
            "marmok:youtube": { id: "UCkxpiTIU50N3_dNt4WMMZyw" },
            "smetanduck:youtube": { handle: "@smetanaml" }
          };

          const twitchChannels = [
            ["leb1ga", "leb1ga"], ["dendi", "dendi"], ["rolex9", "rolex9"],
            ["papaplatte", "papaplatte"], ["montanablack88", "montanablack88"],
            ["trymacs", "trymacs"], ["smetanduck", "smetanduck"],
            ["titamin1", "titamin1"], ["dunkelsch4tten", "dunkelsch4tten"],
            ["buster", "buster"], ["zubarefff", "zubareff"]
          ];

          const existing = JSON.parse(fs.readFileSync("web/live-status.json", "utf8"));
          const previousSources = { ...(existing.sources || {}) };
          const sources = {};
          const now = new Date().toISOString();

          // Keep every configured channel represented even if a provider is
          // temporarily unavailable. Provider refreshes overwrite these entries
          // with real online/offline and recording data.
          for (const key of Object.keys(youtubeChannels)) {
            sources[key] = { online: false, checkedAt: now, mode: "provider-unavailable" };
          }
          for (const [key] of twitchChannels) {
            sources[`${key}:twitch`] = { online: false, checkedAt: now, mode: "provider-unavailable" };
          }

          async function json(url, options = {}) {
            const response = await fetch(url, options);
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${url}`);
            return response.json();
          }

          async function text(url, options = {}) {
            const response = await fetch(url, options);
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${url}`);
            return response.text();
          }

          function firstYoutubeVideoId(xml) {
            const match = xml.match(/<yt:videoId[^>]*>([^<]+)<\\/yt:videoId>/);
            return match?.[1]?.trim();
          }

          async function resolveYoutubeHandle(handle) {
            try {
              const html = await text(`https://www.youtube.com/${handle}`);
              const match =
                html.match(/"channelId":"(UC[A-Za-z0-9_-]{20,})"/) ||
                html.match(/"externalId":"(UC[A-Za-z0-9_-]{20,})"/) ||
                html.match(/channel_id=(UC[A-Za-z0-9_-]{20,})/);
              return match?.[1];
            } catch (error) {
              console.error("YouTube handle", handle, error.message);
              return undefined;
            }
          }

          async function latestYoutubeUpload(channelId) {
            const xml = await text(`https://www.youtube.com/feeds/videos.xml?channel_id=${encodeURIComponent(channelId)}`);
            return firstYoutubeVideoId(xml);
          }

          async function refreshYoutube() {
            for (const [key, channel] of Object.entries(youtubeChannels)) {
              try {
                let channelId = channel.id;
                if (!channelId && channel.handle && process.env.YOUTUBE_API_KEY) {
                  const channelUrl = new URL("https://www.googleapis.com/youtube/v3/channels");
                  channelUrl.search = new URLSearchParams({
                    part: "id",
                    forHandle: channel.handle,
                    key: process.env.YOUTUBE_API_KEY
                  });
                  const channelResponse = await json(channelUrl);
                  channelId = channelResponse.items?.[0]?.id;
                }
                if (!channelId && channel.handle) {
                  channelId = await resolveYoutubeHandle(channel.handle);
                }
                if (!channelId) {
                  console.warn("YouTube", key, "channel id unavailable; skipping");
                  continue;
                }

                // Always obtain the latest upload through RSS. This makes
                // offline playback independent from API-key/quota availability.
                const rssVideoId = await latestYoutubeUpload(channelId);

                if (process.env.YOUTUBE_API_KEY) {
                  const liveUrl = new URL("https://www.googleapis.com/youtube/v3/search");
                  liveUrl.search = new URLSearchParams({
                    part: "snippet", channelId, eventType: "live", type: "video",
                    maxResults: "1", key: process.env.YOUTUBE_API_KEY
                  });
                  const live = await json(liveUrl);
                  const completedUrl = new URL("https://www.googleapis.com/youtube/v3/search");
                  completedUrl.search = new URLSearchParams({
                    part: "snippet", channelId, eventType: "completed", type: "video",
                    order: "date", maxResults: "1", key: process.env.YOUTUBE_API_KEY
                  });
                  const completed = await json(completedUrl);
                  const liveItem = live.items?.[0];
                  const completedVideoId = completed.items?.[0]?.id?.videoId;
                  sources[key] = {
                    online: Boolean(liveItem?.id?.videoId),
                    ...(liveItem?.id?.videoId ? { liveVideoId: liveItem.id.videoId } : {}),
                    ...(completedVideoId ? { fallbackVideoId: completedVideoId } : rssVideoId ? { fallbackVideoId: rssVideoId } : {}),
                    checkedAt: now
                  };
                } else {
                  sources[key] = {
                    online: false,
                    ...(rssVideoId ? { fallbackVideoId: rssVideoId } : {}),
                    checkedAt: now,
                    mode: "rss-fallback"
                  };
                }
              } catch (error) {
                console.error("YouTube", key, error.message);
              }
            }
          }

          async function latestTwitchVod(login) {
            try {
              const html = await text(`https://www.twitch.tv/${encodeURIComponent(login)}/videos?filter=archives&sort=time`);
              const ids = [...html.matchAll(/(?:\\/videos\\/|videoId["':]+\\s*["'])(\\d{6,})/g)].map(match => match[1]);
              return ids[0];
            } catch (error) {
              console.error("Twitch public VOD fallback", login, error.message);
              return undefined;
            }
          }

          async function refreshTwitch() {
            if (!process.env.TWITCH_CLIENT_ID || !process.env.TWITCH_CLIENT_SECRET) {
              for (const [key, login] of twitchChannels) {
                const fallbackVideoId = await latestTwitchVod(login);
                sources[`${key}:twitch`] = {
                  online: false,
                  ...(fallbackVideoId ? { fallbackVideoId } : {}),
                  checkedAt: now,
                  mode: "public-vod-fallback"
                };
              }
              return;
            }
            try {
              const tokenResponse = await json("https://id.twitch.tv/oauth2/token", {
                method: "POST",
                headers: { "content-type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                  client_id: process.env.TWITCH_CLIENT_ID,
                  client_secret: process.env.TWITCH_CLIENT_SECRET,
                  grant_type: "client_credentials"
                })
              });
              const headers = {
                "Authorization": `Bearer ${tokenResponse.access_token}`,
                "Client-Id": process.env.TWITCH_CLIENT_ID
              };
              const usersUrl = new URL("https://api.twitch.tv/helix/users");
              for (const [, login] of twitchChannels) usersUrl.searchParams.append("login", login);
              const users = await json(usersUrl, { headers });
              const userIds = new Map((users.data || []).map(user => [user.login.toLowerCase(), user.id]));
              const streamUrl = new URL("https://api.twitch.tv/helix/streams");
              for (const [, login] of twitchChannels) streamUrl.searchParams.append("user_login", login);
              const streams = await json(streamUrl, { headers });
              const online = new Map((streams.data || []).map(stream => [stream.user_login.toLowerCase(), stream]));
              for (const [key, login] of twitchChannels) {
                const stream = online.get(login.toLowerCase());
                const userId = stream?.user_id || userIds.get(login.toLowerCase());
                let fallbackVideoId;
                try {
                  if (userId) {
                    const vodUrl = new URL("https://api.twitch.tv/helix/videos");
                    vodUrl.searchParams.set("user_id", userId);
                    vodUrl.searchParams.set("type", "archive");
                    vodUrl.searchParams.set("first", "1");
                    const vods = await json(vodUrl, { headers });
                    fallbackVideoId = vods.data?.[0]?.id;
                  }
                } catch (error) {
                  console.error("Twitch VOD", key, error.message);
                }
                sources[`${key}:twitch`] = {
                  online: Boolean(stream),
                  ...(stream?.id ? { liveVideoId: stream.id } : {}),
                  ...(fallbackVideoId ? { fallbackVideoId } : {}),
                  checkedAt: now
                };
              }
            } catch (error) {
              console.error("Twitch", error.message);
            }
          }

          (async () => {
            await refreshYoutube().catch(error => console.error("YouTube refresh", error.message));
            await refreshTwitch().catch(error => console.error("Twitch refresh", error.message));

            // Never publish a cache with zero sources. If every upstream provider
            // is temporarily unreachable, keep the last known connected state.
            const refreshedCount = Object.keys(sources).length;
            const finalSources = refreshedCount > 0 ? sources : previousSources;
            if (Object.keys(finalSources).length === 0) {
              throw new Error("LIVE refresh produced zero sources and no previous cache exists");
            }

            fs.writeFileSync("web/live-status.json", JSON.stringify({ generatedAt: now, sources: finalSources }, null, 2) + "\n");
            const result = JSON.parse(fs.readFileSync("web/live-status.json", "utf8"));
            const sourceCount = Object.keys(result.sources || {}).length;
            if (result.generatedAt !== now || !result.sources || typeof result.sources !== "object") {
              throw new Error("LIVE status cache validation failed");
            }
            if (sourceCount === 0) {
              throw new Error("LIVE status cache refresh produced zero sources; preserving the previous cache.");
            }
            console.log("LIVE status cache refreshed:", sourceCount, "sources");
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit changed LIVE status cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- web/live-status.json; then
            echo "LIVE status cache unchanged"
            exit 0
          fi
          git add web/live-status.json
          git commit -m "chore: refresh LIVE playback status"
          git push origin HEAD:main
