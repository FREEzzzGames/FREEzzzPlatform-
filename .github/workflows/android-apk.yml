name: Build FREEzzz Platform APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web runtime
        run: npm install && npm run build
      - name: Copy web runtime into Android assets
        run: mkdir -p android/app/src/main/assets && cp -R dist/. android/app/src/main/assets/
      - name: Verify packaged web runtime
        run: |
          test -s android/app/src/main/assets/index.html
          grep -q 'assets/' android/app/src/main/assets/index.html
          test -d android/app/src/main/assets/assets
          test -n "$(find android/app/src/main/assets/assets -type f | head -n 1)"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Verify Android ROM picker
        run: |
          grep -q 'onShowFileChooser' android/app/src/main/java/com/freezzz/platform/MainActivity.java
          grep -q 'ACTION_OPEN_DOCUMENT' android/app/src/main/java/com/freezzz/platform/MainActivity.java
          grep -q 'FILE_REQUEST' android/app/src/main/java/com/freezzz/platform/MainActivity.java
      - name: Verify gamepad geometry
        run: |
          grep -q '.sega-x{left:0;top:0}' web/styles.css
          grep -q '.sega-y{left:69px;top:0}' web/styles.css
          grep -q '.sega-z{left:138px;top:0}' web/styles.css
          grep -q '.sega-a{left:0;top:60px}' web/styles.css
          grep -q '.sega-b{left:69px;top:60px}' web/styles.css
          grep -q '.sega-c{left:138px;top:60px}' web/styles.css
      - name: Verify WebView restart lifecycle
        run: |
          grep -q 'Always boot the local portal' android/app/src/main/java/com/freezzz/platform/MainActivity.java
          grep -q 'onRenderProcessGone' android/app/src/main/java/com/freezzz/platform/MainActivity.java
          grep -q 'WebView renderer exited' android/app/src/main/java/com/freezzz/platform/MainActivity.java
      - name: Verify public radio and release catalog
        run: |
          grep -q 'RadioBrowserClient' web/main.ts
          grep -q 'RADIO_GENRES' web/main.ts
          grep -q 'is_https' web/radio-browser.ts
          grep -q 'Local Mega Drive ROM' web/main.ts
          if grep -Eqi 'Mortal Kombat|WWF WrestleMania|Bart vs. the Space Mutants' web/main.ts; then exit 1; fi
      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FREEzzzPlatform-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
