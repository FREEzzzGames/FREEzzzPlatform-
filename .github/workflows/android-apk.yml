name: Build FREEzzz Platform APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web runtime
        run: npm install && npm run build
      - name: Copy web runtime into Android assets
        run: mkdir -p android/app/src/main/assets && cp -R dist/. android/app/src/main/assets/
      - name: Verify packaged web runtime
        run: |
          test -s android/app/src/main/assets/index.html
          grep -q 'assets/' android/app/src/main/assets/index.html
          test -d android/app/src/main/assets/assets
          test -n "$(find android/app/src/main/assets/assets -type f | head -n 1)"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FREEzzzPlatform-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
